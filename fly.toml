# Fly.io config for the read-only demo (Dockerfile sets VIBEDOC_DEMO=1 and the example project).
app = "vibedoc-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_to_run = 0

[[vm]]
  memory = "512mb"
