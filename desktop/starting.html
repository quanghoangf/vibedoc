<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>VibeDoc</title>
<style>
  :root { color-scheme: dark; --bg: #0a0a0f; --fg: #e6e6ef; --muted: #8b8ba3; --accent: #7c6af7; --danger: #f2667a; --code: #16161f; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #fafafc; --fg: #16161f; --muted: #5d5d73; --danger: #c22d45; --code: #ececf3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: min(36rem, 100% - 4rem); }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  .spinner::before { content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent);
    margin-right: .6rem; vertical-align: middle; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .spinner::before { animation: none; } }
  .reason { color: var(--danger); }
  pre { max-height: 14rem; overflow: auto; padding: .6rem .8rem; border-radius: 8px; background: var(--code); color: var(--fg);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; margin: 0 0 1rem; }
  a.button { display: inline-block; padding: .45rem 1rem; border-radius: 8px; background: var(--accent); color: #fff;
    text-decoration: none; font-weight: 600; }
  a.button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="body"></p>
  <p class="reason" id="reason" hidden></p>
  <pre id="log" hidden></pre>
  <p id="logPath" hidden></p>
  <a class="button" id="retry" href="#retry" hidden></a>
</main>
<script>
  // The text comes from desktop/i18n.mjs through the query string (main.mjs), so this page has none of its own.
  // Retry is a hash link: main.mjs hears the in-page navigation and starts again.
  const q = new URLSearchParams(location.search)
  document.documentElement.lang = q.get('lang') || 'en'
  const failed = q.get('state') === 'failed'
  for (const id of ['title', 'body', 'reason', 'log', 'logPath', 'retry']) {
    const el = document.getElementById(id)
    const text = q.get(id) || ''
    el.textContent = text
    if (text) el.hidden = false
  }
  if (!failed) document.getElementById('body').classList.add('spinner')
  document.title = q.get('title') || 'VibeDoc'
  if (failed) document.getElementById('retry').focus()
</script>
</body>
</html>
