<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>VibeDoc</title>
<style>
  :root { color-scheme: dark; --bg: #0a0a0f; --fg: #e6e6ef; --muted: #8b8ba3; --accent: #7c6af7; --code: #16161f; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #fafafc; --fg: #16161f; --muted: #5d5d73; --code: #ececf3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 28rem; padding: 2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  code { display: block; padding: .6rem .8rem; border-radius: 8px; background: var(--code); color: var(--fg);
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; margin-bottom: 1rem; }
  .hint { font-size: 13px; }
  .hint::before { content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent);
    margin-right: .5rem; vertical-align: middle; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .hint::before { animation: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="body"></p>
  <code>vibedoc start</code>
  <p class="hint" id="hint"></p>
</main>
<script>
  // the text comes from desktop/i18n.mjs through the query string (main.mjs), so this page has none of its own
  const q = new URLSearchParams(location.search)
  document.documentElement.lang = q.get('lang') || 'en'
  for (const id of ['title', 'body', 'hint']) document.getElementById(id).textContent = q.get(id) || ''
  document.title = q.get('title') || 'VibeDoc'
</script>
</body>
</html>
