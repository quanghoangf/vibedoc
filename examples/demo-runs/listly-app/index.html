<!doctype html>
<!-- Listly mock (R085): a static stand-in for the fictional app, so scripts/demo-run.mjs can record the demo's evidence run. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listly</title>
<style>
  :root { --bg: #f7f5f0; --card: #fff; --ink: #1d1b16; --muted: #6b665c; --accent: #2f6f4f; --line: #e3ded3; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
  header b { font-size: 17px; color: var(--accent); }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .banner { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; background: #eef4ef; color: var(--accent); font-size: 13px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: 380px; }
  code { display: block; margin-top: 8px; padding: 8px; background: var(--bg); border-radius: 6px; font-size: 13px; }
  label { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<header><b>Listly</b><span class="muted" id="who">Signed in as maya@team.dev</span></header>
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search)
  const shared = params.get('view') === 'shared'
  const linkOn = params.get('link') !== 'off'
  const items = ['Oat milk', 'Coffee beans', 'Bananas', 'Paper towels']
  const app = document.getElementById('app')
  if (shared) document.getElementById('who').textContent = 'Not signed in'
  if (shared && !linkOn) {
    app.innerHTML = '<div class="card"><h1>This list isn\'t shared</h1><p class="muted">Ask the owner for a new link.</p></div>'
  } else {
    app.innerHTML = `
      <div class="card">
        ${shared ? '<div class="banner" role="status">Shared with you · read-only</div>' : ''}
        <div class="row"><div><h1>Team groceries</h1><span class="muted">${items.length} items</span></div>
          ${shared ? '' : '<button class="primary" id="share">Share</button>'}</div>
        <ul aria-label="Items">${items.map((i) => `<li>${i}</li>`).join('')}</ul>
        ${shared ? '' : '<p><button id="add">Add item</button></p>'}
      </div>
      <dialog id="dlg" aria-label="Share Team groceries">
        <h2 style="margin:0 0 12px;font-size:17px">Share "Team groceries"</h2>
        <label><input type="checkbox" id="toggle" ${params.get('link') === 'on' ? 'checked' : ''}> Anyone with the link can view</label>
        <code id="url" hidden>https://listly.app/l/7f3k9</code>
        <p class="row" style="margin:16px 0 0"><span class="muted" id="state"></span><button id="close">Done</button></p>
      </dialog>`
    const dlg = document.getElementById('dlg')
    const toggle = document.getElementById('toggle')
    const sync = () => {
      document.getElementById('url').hidden = !toggle.checked
      document.getElementById('state').textContent = toggle.checked ? 'Link is on' : 'Link is off'
    }
    document.getElementById('share')?.addEventListener('click', () => { sync(); dlg.showModal() })
    toggle?.addEventListener('change', sync)
    document.getElementById('close')?.addEventListener('click', () => dlg.close())
  }
</script>
</body>
</html>
